# Tenant wiring. Moving to another customer means adding a sibling directory and
# (if their systems differ) new adapters under integrations/ — nothing else.
version: 1
tenant: netswift
display_name: "NetSwift Telecom"
locale: en-GB
timezone: Europe/London
currency: GBP

business_domain: fiber_isp
customer_identifier:
  label_en: "Customer number"
  pattern: "^NS-\\d{6}$"
  example: "NS-100042"

# Adapter endpoints. Values resolve from the environment so the same config works in
# compose, staging and production.
adapters:
  core:
    transport: mcp_streamable_http
    url: ${MCP_CORE_URL}
    required: true
  payment:
    transport: mcp_streamable_http
    url: ${MCP_PAYMENT_URL}
    required: true
  ticketing:
    transport: mcp_streamable_http
    url: ${MCP_TICKETING_URL}
    required: true
  monitoring:
    transport: mcp_streamable_http
    url: ${MCP_MONITORING_URL}
    required: false
  notification:
    transport: mcp_streamable_http
    url: ${MCP_NOTIFICATION_URL}
    required: false

departments:
  TECHNICAL_INFRA:
    display_name_en: "Technical Infrastructure"
    channel: technical-infra
  BILLING:
    display_name_en: "Billing"
    channel: billing
  SUBSCRIPTION_OPS:
    display_name_en: "Subscription Operations"
    channel: subscription-ops
  FIELD_INSTALL:
    display_name_en: "Field Installation Team"
    channel: field-install

persona:
  name_en: "NetSwift Digital Assistant"
  tone_en: "polite, clear, short sentences; never loads the customer with technical jargon"
  language: en
  disclaimers_en:
    - "I pass anything outside my authority to the relevant team."
