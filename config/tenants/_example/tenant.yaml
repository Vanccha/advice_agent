# A deliberately DIFFERENT second customer, so "adding a tenant needs no code change" is
# something you can run rather than something you take on faith. Everything here differs
# from `nethiz/`: identifier format, persona, tone, even which adapters are mandatory.
version: 1
tenant: _example
display_name: "Örnek Fiber A.Ş."
locale: tr-TR
timezone: Europe/Istanbul
currency: TRY

business_domain: fiber_isp
customer_identifier:
  label_tr: "Abone numarası"
  pattern: "^OR-[0-9]{7}$"
  example: "OR-2045118"

adapters:
  core:
    transport: mcp_streamable_http
    url: ${MCP_CORE_URL}
    required: true
  payment:
    transport: mcp_streamable_http
    url: ${MCP_PAYMENT_URL}
    required: true
  ticketing:
    transport: mcp_streamable_http
    url: ${MCP_TICKETING_URL}
    required: true
  # This customer does not expose its monitoring or chat platform to suppliers, so the
  # assistant runs without them: no proactive alert diagnosis, no department channel posts.
  monitoring:
    transport: mcp_streamable_http
    url: ${MCP_MONITORING_URL}
    required: false
  notification:
    transport: mcp_streamable_http
    url: ${MCP_NOTIFICATION_URL}
    required: false

departments:
  TECHNICAL_INFRA:
    display_name_tr: "Şebeke Operasyon"
    channel: sebeke-operasyon
  BILLING:
    display_name_tr: "Gelir Yönetimi"
    channel: gelir-yonetimi
  SUBSCRIPTION_OPS:
    display_name_tr: "Müşteri Operasyon"
    channel: musteri-operasyon
  FIELD_INSTALL:
    display_name_tr: "Saha Hizmetleri"
    channel: saha-hizmetleri

persona:
  name_tr: "Örnek Fiber Yardım Asistanı"
  tone_tr: "resmi, mesafeli, kısa ve net; samimiyet kurmaz"
  language: tr
  disclaimers_tr:
    - "Bu görüşme kalite amacıyla kayıt altına alınır."
    - "Yetkim dışındaki talepler ilgili birime iletilir."
