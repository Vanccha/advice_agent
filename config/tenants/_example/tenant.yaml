# A deliberately DIFFERENT second customer, so "adding a tenant needs no code change" is
# something you can run rather than something you take on faith. Everything here differs
# from `netswift/`: identifier format, persona, tone, even which adapters are mandatory.
version: 1
tenant: _example
display_name: "Example Fibre Ltd"
locale: en-GB
timezone: Europe/London
currency: GBP

business_domain: fiber_isp
customer_identifier:
  label_en: "Account number"
  pattern: "^OR-[0-9]{7}$"
  example: "OR-2045118"

adapters:
  core:
    transport: mcp_streamable_http
    url: ${MCP_CORE_URL}
    required: true
  payment:
    transport: mcp_streamable_http
    url: ${MCP_PAYMENT_URL}
    required: true
  ticketing:
    transport: mcp_streamable_http
    url: ${MCP_TICKETING_URL}
    required: true
  # This customer does not expose its monitoring or chat platform to suppliers, so the
  # assistant runs without them: no proactive alert diagnosis, no department channel posts.
  monitoring:
    transport: mcp_streamable_http
    url: ${MCP_MONITORING_URL}
    required: false
  notification:
    transport: mcp_streamable_http
    url: ${MCP_NOTIFICATION_URL}
    required: false

departments:
  TECHNICAL_INFRA:
    display_name_en: "Network Operations"
    channel: network-operations
  BILLING:
    display_name_en: "Revenue Management"
    channel: revenue-management
  SUBSCRIPTION_OPS:
    display_name_en: "Customer Operations"
    channel: customer-operations
  FIELD_INSTALL:
    display_name_en: "Field Services"
    channel: field-services

persona:
  name_en: "Example Fibre Help Assistant"
  tone_en: "formal, reserved, brief and clear; never chummy"
  language: en
  disclaimers_en:
    - "This conversation is recorded for quality purposes."
    - "Requests outside my authority are passed to the relevant unit."
