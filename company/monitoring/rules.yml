groups:
  - name: netswift-alerts
    rules:
      - alert: PaymentGatewayDown
        expr: up{job="payment-gateway"} == 0 or psp_outage == 1
        for: 1m
        labels:
          severity: critical
          department: TECHNICAL_INFRA
        annotations:
          summary: "Payment gateway unreachable"
          description: >-
            The payment-gateway service has not answered its health check for a minute, or the
            PSP is in deliberate outage mode. New payments may fail; urgent checks are needed.

      - alert: CoreApiDown
        expr: up{job="core-api"} == 0
        for: 1m
        labels:
          severity: critical
          department: TECHNICAL_INFRA
        annotations:
          summary: "Core API unreachable"
          description: >-
            The core-api service has not answered its health check for a minute. Every
            subscription, customer and billing operation may be affected.

      - alert: StuckProvisioningJobs
        expr: netswift_provisioning_jobs_stuck > 0
        for: 2m
        labels:
          severity: warning
          department: SUBSCRIPTION_OPS
        annotations:
          summary: "Stuck provisioning jobs"
          description: >-
            At least one provisioning job has been 'stuck' for two minutes. The setup status of
            the affected subscriptions should be checked manually.

      - alert: HighPaymentFailureRate
        expr: >-
          rate(psp_charges_total{status="failed"}[5m]) /
          clamp_min(rate(psp_charges_total[5m]),0.001) > 0.5
        for: 3m
        labels:
          severity: critical
          department: BILLING
        annotations:
          summary: "High payment failure rate"
          description: >-
            More than half of the payments attempted in the last five minutes failed. There may
            be a problem at the PSP or the card provider; the billing team should be informed.

      - alert: RegionalOutageDetected
        expr: netswift_open_incidents{severity="critical"} > 0
        for: 1m
        labels:
          severity: critical
          department: TECHNICAL_INFRA
        annotations:
          summary: "Regional outage detected"
          description: >-
            There is an open, critical regional fault record. Customers in the affected region
            should be informed and the field team dispatched.

      - alert: MissedInstallations
        expr: netswift_missed_appointments_24h > 0
        for: 5m
        labels:
          severity: warning
          department: FIELD_INSTALL
        annotations:
          summary: "Missed installation appointments"
          description: >-
            At least one field installation appointment was missed in the last 24 hours. A new
            appointment needs to be booked with the customer.
