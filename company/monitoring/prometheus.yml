global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: core-api
    static_configs:
      - targets: ["core-api:8000"]

  - job_name: provisioning-worker
    static_configs:
      - targets: ["provisioning-worker:8000"]

  - job_name: payment-gateway
    static_configs:
      - targets: ["payment-gateway:8000"]

  - job_name: ticketing
    static_configs:
      - targets: ["ticketing:8000"]

  - job_name: notification-hub
    static_configs:
      - targets: ["notification-hub:8000"]
