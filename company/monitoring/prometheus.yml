# Prometheus scrape configuration for the company stack.
#
# Where this sits: loaded by the Prometheus container; scrapes every service's
# /metrics endpoint and evaluates rules.yml, sending firing alerts to Alertmanager.
#
# Key ideas:
# - Pull-based monitoring: Prometheus fetches metrics from each service on a
#   fixed interval, so a service that stops answering is itself a signal (`up == 0`).
# - One job per service, named exactly like the service, so alert rules can select
#   with `up{job="..."}`.
#
# Read next: rules.yml.

global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: core-api
    static_configs:
      - targets: ["core-api:8000"]

  - job_name: provisioning-worker
    static_configs:
      - targets: ["provisioning-worker:8000"]

  - job_name: payment-gateway
    static_configs:
      - targets: ["payment-gateway:8000"]

  - job_name: ticketing
    static_configs:
      - targets: ["ticketing:8000"]

  - job_name: notification-hub
    static_configs:
      - targets: ["notification-hub:8000"]
