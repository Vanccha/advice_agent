# Advisory-mode evaluations: ten customer profiles, the conversation that produces
# them, and the package the deterministic scoring engine must recommend.
#
# `expected_best` is the engine's own answer, verified by running it (see evals/README.md) —
# these are regression anchors, so a change in the weights or the catalogue shows up here as
# a failing case rather than as silently different advice. `acceptable_best` allows a second
# code where two packages are genuinely close; `must_not_recommend` catches advice that would
# be wrong for the customer regardless of score.
version: 1

profiles:
  - id: student_tight_budget
    summary_en: "Student, lives alone, tight budget"
    conversation_en:
      - "Hi, I am a student and I would like to get broadband at home."
      - "I live on my own and use a phone and a laptop."
      - "No more than £30 a month."
      - "A contract is fine, I do not mind."
    profile:
      usage: [student]
      household_size: 1
      device_count: 2
      budget_gbp: 30
      commitment_preference: any
    expect:
      expected_best: FIBER_50_STUDENT
      must_not_recommend: [FIBER_1000_PREMIUM, FIBER_500_GAMER, FIBER_400_HOMEOFFICE]
      max_monthly_price_gbp: 34.5

  - id: family_of_four_streaming
    summary_en: "Family of four, streams shows every evening"
    conversation_en:
      - "There are 4 of us and we stream shows every evening."
      - "Phones, two TVs and a tablet. About 8 devices."
      - "My budget is around £50."
      - "I am happy to sign a 24 month contract."
    profile:
      usage: [family, streaming]
      household_size: 4
      device_count: 8
      budget_gbp: 50
      commitment_preference: "24"
    expect:
      expected_best: FIBER_200_FAMILY
      must_not_recommend: [FIBER_50_STUDENT]
      min_down_mbps: 150

  - id: home_office_static_ip
    summary_en: "Works from home, needs a static IP"
    conversation_en:
      - "I work from home and my company wants a static IP for the VPN."
      - "There are 2 of us but about 12 devices connected."
      - "Budget does not matter, I cannot afford downtime. I would rather not say."
      - "A 24 month contract is fine."
    profile:
      usage: [home_office]
      household_size: 2
      device_count: 12
      budget_gbp: null
      commitment_preference: "24"
      needs_static_ip: true
    expect:
      expected_best: FIBER_400_HOMEOFFICE
      must_have_static_ip: true

  - id: gamer_low_latency
    summary_en: "Gamer, very sensitive to latency"
    conversation_en:
      - "I play online games and ping really matters."
      - "There are 3 of us, with 10 devices."
      - "I can spend up to £80 a month."
      - "I do not want a long contract, 12 months is fine."
    profile:
      usage: [gaming]
      household_size: 3
      device_count: 10
      budget_gbp: 80
      commitment_preference: "12"
    expect:
      expected_best: FIBER_500_GAMER
      must_not_recommend: [FIBER_50_STUDENT, FIBER_100_BASIC]

  - id: no_commitment_seeker
    summary_en: "Short-term tenant who does not want a contract"
    conversation_en:
      - "I am moving out in six months, so I do not want a contract."
      - "There are 2 of us, 5 devices."
      - "The price can be a bit higher as long as I am not tied in."
    profile:
      usage: [basic]
      household_size: 2
      device_count: 5
      budget_gbp: null
      commitment_preference: none
    expect:
      expected_best: FIBER_200_FLEX
      must_have_no_commitment: true

  - id: elderly_basic_use
    summary_en: "Lives alone, very basic use"
    conversation_en:
      - "I just read the news and video call my grandchildren."
      - "I live on my own, with a phone and a tablet."
      - "As cheap as possible, please."
    profile:
      usage: [basic]
      household_size: 1
      device_count: 2
      budget_gbp: 30
      commitment_preference: any
    expect:
      expected_best: FIBER_50_STUDENT
      max_monthly_price_gbp: 35

  - id: crowded_household
    summary_en: "Busy household, many devices, mixed use"
    conversation_en:
      - "There are 6 of us at home, everyone has a phone, plus two smart TVs."
      - "About 20 devices connect."
      - "The budget is flexible, up to £100."
      - "I do not mind about the contract."
    profile:
      usage: [family, streaming]
      household_size: 6
      device_count: 20
      budget_gbp: 100
      commitment_preference: any
    expect:
      expected_best: FIBER_1000_PREMIUM
      min_down_mbps: 400

  - id: tv_bundle_wanted
    summary_en: "Family who want a TV package included"
    conversation_en:
      - "We would like a TV package along with the broadband."
      - "We are a family of 4, with 9 devices."
      - "Around £60 a month works for us."
      - "We can sign a 24 month contract."
    profile:
      usage: [family]
      household_size: 4
      device_count: 9
      budget_gbp: 60
      commitment_preference: "24"
      needs_tv: true
    expect:
      expected_best: FIBER_200_FAMILY
      must_have_tv: true

  - id: small_business_from_home
    summary_en: "Runs a small business from home, cannot tolerate downtime"
    conversation_en:
      - "I run a small online shop from my home office."
      - "I need a constant connection; there are 15 devices, including a camera system."
      - "I can set aside £70 a month."
      - "A 24 month contract is fine."
    profile:
      usage: [home_office]
      household_size: 3
      device_count: 15
      budget_gbp: 70
      commitment_preference: "24"
    expect:
      expected_best: FIBER_400_HOMEOFFICE
      min_down_mbps: 300

  - id: budget_conflict
    summary_en: "Needs exceed the budget — the assistant must honestly offer the closest fit"
    conversation_en:
      - "There are 5 of us, all streaming at the same time, and there is gaming too."
      - "18 devices."
      - "But I can only pay £35 a month at most."
      - "A contract is fine."
    profile:
      usage: [family, gaming, streaming]
      household_size: 5
      device_count: 18
      budget_gbp: 35
      commitment_preference: any
    expect:
      expected_best: FIBER_100_BASIC
      # The budget filter must win over the speed need, and the reply must be honest
      # about the trade-off rather than quietly recommending something unaffordable.
      max_monthly_price_gbp: 40.3
      reply_should_acknowledge_tradeoff: true

# Properties that must hold for EVERY profile above.
invariants:
  max_offers_returned: 3       # top-3; fewer is correct when the budget filter excludes the rest
  min_offers_returned: 1
  deterministic: true          # same profile twice -> identical offers, in the same order
  reasons_from_config_only: true
  no_package_outside_catalogue: true
