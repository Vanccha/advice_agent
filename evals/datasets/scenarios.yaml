# Scenario evaluations. Each case injects a chaos scenario, sends one user message,
# and asserts what the assistant must conclude and do. Expectations are written in terms of
# the contract's own vocabulary (Mode, IssueType, Department, action names) so they do not
# depend on any particular wording of the reply.
#
# `must_not_create_ticket: true` is the sharpest assertion in this file: it is what separates
# a useful assistant from one that just forwards everything to a human.
version: 1

scenarios:
  - id: stuck_provisioning
    chaos: stuck_provisioning
    summary_en: "The provisioning job is stuck; the assistant can fix it itself."
    expect:
      final_mode: [ACTION, CLOSING]
      issue_type: stuck_provisioning
      scope: customer_specific
      action_executed: retry_provisioning_job
      must_not_create_ticket: true
      reply_must_mention_any_en: ["provisioning", "setup", "restart"]
    messages:
      - tone: polite
        text: "Hello, I signed up last week and my payment went through, but my internet still has not been switched on. Is something wrong?"
      - tone: angry
        text: "I have been waiting three days! You took the money and there is still no internet. What kind of service is this?"
      - tone: vague
        text: "wont connect"
      - tone: polite
        text: "Good afternoon, how long does it take for my line to go live? I applied, I paid, and I am still waiting."

  - id: paid_not_active
    chaos: paid_not_active
    summary_en: "Payment taken but provisioning never started; a small fix within the assistant's authority."
    expect:
      final_mode: [ACTION, CLOSING]
      issue_type: paid_not_active
      scope: customer_specific
      action_executed_any: [enqueue_provisioning_job, retry_provisioning_job, resend_activation_notification]
      must_not_create_ticket: true
      reply_must_mention_any_en: ["payment", "active", "setup", "queued"]
    messages:
      - tone: polite
        text: "I made my payment and the bank approved it, but my subscription still does not show as active. Could you help?"
      - tone: angry
        text: "The payment screen said it was successful, then nothing happened. So you took my money but never opened the subscription."
      - tone: vague
        text: "paid but nothing happened"

  - id: regional_outage
    chaos: regional_outage
    summary_en: "Regional infrastructure fault; a known incident, so no ticket per customer."
    expect:
      final_mode: [DIAGNOSTIC, ACTION, CLOSING, ESCALATED]
      issue_type: regional_outage
      scope: regional_incident
      incident_ref_required: true
      max_tickets_for_incident: 1
      reply_must_mention_any_en: ["area", "fault", "outage", "affect"]
      reply_must_not_mention_any_en: ["a problem specific to you"]
    messages:
      - tone: polite
        text: "Hi, we have had no internet since this morning. The router lights look different too. Is the problem on our side?"
      - tone: angry
        text: "The internet has gone down again! I work from home and missed a meeting. When will this be fixed?"
      - tone: vague
        text: "no internet"
      - tone: polite
        text: "My neighbour has the same problem, is there a fault in the area?"

  - id: double_charge
    chaos: double_charge
    summary_en: "Double charge; refunds are outside the assistant's authority, so it goes to Billing with the evidence."
    expect:
      final_mode: [ESCALATED]
      issue_type: double_charge
      scope: customer_specific
      policy_denied_action: issue_refund
      ticket_department: BILLING
      ticket_must_create: true
      ticket_evidence_must_include_payment_ids: true
      ticket_must_list_attempted_steps: true
      reply_must_mention_any_en: ["billing", "refund", "passed"]
    messages:
      - tone: polite
        text: "Hello, the same amount has been taken from my account twice this month. Could you check?"
      - tone: angry
        text: "You have charged me twice for the same bill! I want a refund immediately, or I will be making a complaint."
      - tone: vague
        text: "charged twice"

  - id: missed_installation
    chaos: missed_installation
    summary_en: "Installation appointment missed; rebooking belongs to the Field Installation Team."
    expect:
      final_mode: [ESCALATED]
      issue_type: missed_installation
      scope: customer_specific
      policy_denied_action: reschedule_installation
      ticket_department: FIELD_INSTALL
      ticket_must_create: true
      ticket_evidence_must_include_appointment_id: true
      reply_must_mention_any_en: ["installation", "team", "appointment"]
    messages:
      - tone: polite
        text: "I waited in for the installation yesterday but nobody came. Can I get a new appointment?"
      - tone: angry
        text: "I took a day off and waited at home, the engineers never turned up and nobody called. A whole day wasted."
      - tone: vague
        text: "they never came"

  - id: payment_down
    chaos: payment_down
    summary_en: "The payment service is completely down; a system problem, and the customer is told so honestly."
    expect:
      final_mode: [DIAGNOSTIC, ESCALATED, CLOSING]
      issue_type: payment_system_down
      scope: system_wide
      must_not_blame_customer: true
      ticket_department_if_created: TECHNICAL_INFRA
      reply_must_mention_any_en: ["payment", "temporarily", "system", "right now"]
    messages:
      - tone: polite
        text: "I am trying to make a payment but the screen keeps showing an error. Is there something wrong with my card?"
      - tone: angry
        text: "Your payment page is not working! I tried three times and got an error every time. My card is fine."
      - tone: vague
        text: "payment not going through"

# Cases that must NOT turn into a ticket or an action at all.
no_action_cases:
  - id: smalltalk
    message: "Thank you, have a good day."
    expect:
      must_not_create_ticket: true
      must_not_execute_action: true
  - id: out_of_scope
    message: "Can you give me the number of the nearest pizza place?"
    expect:
      must_not_create_ticket: true
      must_not_execute_action: true
      reply_must_mention_any_en: ["help", "assist", "internet", "broadband"]
  - id: status_query
    message: "What is the status of the ticket you opened for me the other day?"
    expect:
      # CLOSING is the correct resting mode once a status question has been answered —
      # the same way the other scenarios end. The assertion that carries weight here is
      # that asking about an existing record opens nothing new.
      final_mode: [STATUS_QUERY, ROUTER, DIAGNOSTIC, CLOSING]
      must_not_create_ticket: true
      must_not_execute_action: true
      reply_must_mention_any_en: ["request", "record", "status", "ticket", "subscription"]
